# Portable Codex defaults. The live ~/.codex/config.toml stays local because
# Codex writes account, plugin, cache, and trusted-project state into it.

model_reasoning_effort = "high"
personality = "pragmatic"

[features]
memories = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]
