onboarding = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

settings = ""
workspace_picker = "prefix+s"
new_workspace = "prefix+shift+c"
new_worktree = "prefix+shift+w"
rename_workspace = "prefix+$"
switch_workspace = ""
focus_agent = "cmd+1..9"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "shift+left"
next_tab = "shift+right"

split_vertical = ["prefix+backslash", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = '"$HERDR_BIN_PATH" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'
description = "move pane to new tab"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = 'export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"; dir=$(fd -H -t d -d 3 "^\.git$" ~/Documents/code -x dirname | sort -u | fzf --prompt="new workspace > ") && [ -n "$dir" ] && herdr workspace create --cwd "$dir" --label "${dir##*/}" --focus'
width = "70%"
height = "50%"

[ui]
# A tab name typed at the prompt marks the tab manual and hides it from Auto
# Title for good.
prompt_new_tab_name = false
prompt_new_workspace_name = true
pane_gaps = false
agent_panel_sort = "spaces"

status_indicators = "dots"
show_agent_labels_on_pane_borders = true

# Pane metadata from Claude's statusline and Pi's auto-session-title extension:
# Herdr has no repo, branch, PR, model or subscription token for agent rows,
# cannot wrap a row (hence $title1..3) and fixes token colors here (hence one
# token per colored value).
[ui.sidebar.agents]
# Bold titles keep neighbouring six-line entries from blurring together. The
# branch is the row that says which piece of work a pane is on, so it gets a row
# to itself, undimmed; the color-coded repo and PR follow it, with runtime details
# together on the bottom row.
rows = [
  ["state_icon", { token = "$num", bold = true, dim = false }, { token = "$title1", bold = true, dim = false }],
  [{ token = "$title2", bold = true, dim = false }],
  [{ token = "$title3", bold = true, dim = false }],
  [{ token = "$branch", dim = false }],
  [
    # Repositories own the bright-pastel color namespace. Integrations hash
    # names into this palette so projects stay recognizable without adding
    # work-specific configuration here.
    { token = "$repo_color_1", dim = false, fg = "#94e2d5" },
    { token = "$repo_color_2", dim = false, fg = "#f5c2e7" },
    { token = "$repo_color_3", dim = false, fg = "#a6e3a1" },
    { token = "$repo_color_4", dim = false, fg = "#89b4fa" },
    { token = "$repo_color_5", dim = false, fg = "#f38ba8" },
    { token = "$repo_color_6", dim = false, fg = "#cba6f7" },
    # Keep older, already-running integrations visible until they reload.
    { token = "$repo", dim = true },
    { token = "$pr_open", dim = false, fg = "#3fb950" },
    { token = "$pr_draft", dim = false, fg = "#8b949e" },
    { token = "$pr_merged", dim = false, fg = "#a371f7" },
    { token = "$pr_closed", dim = false, fg = "#f85149" },
  ],
  [
    # Subscriptions use saturated accents and bold text; models use a quieter,
    # muted namespace. Literal shades stay disjoint from each other and from
    # repository colors, so adjacent metadata cannot collapse into one color.
    # Fixed palette: arbitrary labels share slots, never extra rows/tokens.
    # Seven cycling Claude colors plus Codex orange leave room for eight models
    # within Herdr's 16-token row limit.
    { token = "$subscription_color_1", bold = true, dim = false, fg = "#168cff" },
    { token = "$subscription_color_2", bold = true, dim = false, fg = "#00b8d9" },
    { token = "$subscription_color_3", bold = true, dim = false, fg = "#d9a400" },
    { token = "$subscription_color_4", bold = true, dim = false, fg = "#16b364" },
    { token = "$subscription_color_5", bold = true, dim = false, fg = "#ff5a52" },
    { token = "$subscription_color_6", bold = true, dim = false, fg = "#9d73f7" },
    { token = "$subscription_color_7", bold = true, dim = false, fg = "#ed4fa8" },
    { token = "$subscription_codex", bold = true, dim = false, fg = "#ff7a00" },
    { token = "$model_fable", dim = false, fg = "#d8a0df" },
    { token = "$model_opus", dim = false, fg = "#b9a0dc" },
    { token = "$model_sonnet", dim = false, fg = "#82a9d8" },
    { token = "$model_haiku", dim = false, fg = "#79c8bd" },
    { token = "$model_sol", dim = false, fg = "#d8c27a" },
    { token = "$model_terra", dim = false, fg = "#83c891" },
    { token = "$model_luna", dim = false, fg = "#929bd2" },
    { token = "$model_other", dim = false, fg = "#72b7d5" },
  ],
]

[experimental]
kitty_graphics = true

[update]
channel = "preview"
