onboarding = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

settings = ""
workspace_picker = "prefix+s"
new_workspace = "prefix+shift+c"
new_worktree = "prefix+shift+w"
rename_workspace = "prefix+$"
switch_workspace = ""
focus_agent = "cmd+1..9"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "shift+left"
next_tab = "shift+right"

split_vertical = ["prefix+backslash", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "young.open-pr.open-pr"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = 'export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"; dir=$(fd -H -t d -d 3 "^\.git$" ~/Documents/code -x dirname | sort -u | fzf --prompt="new workspace > ") && [ -n "$dir" ] && herdr workspace create --cwd "$dir" --label "${dir##*/}" --focus'
width = "70%"
height = "50%"

[ui]
# A tab name typed at the prompt marks the tab manual and hides it from Auto
# Title for good.
prompt_new_tab_name = false
prompt_new_workspace_name = true
pane_gaps = false
agent_panel_sort = "spaces"

status_indicators = "dots"
show_agent_labels_on_pane_borders = true

# Pane metadata from claude/statusline-command.sh: herdr has no repo, branch or
# PR token for agent rows, cannot wrap a row (hence $title1..3) and fixes a
# token's color here (hence one $pr_<state> token per PR state).
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "$num", bold = true, dim = false }, { token = "$title1", bold = true, dim = false }],
  [{ token = "$title2", bold = true, dim = false }],
  [{ token = "$title3", bold = true, dim = false }],
  [{ token = "$repo", dim = false }],
  [
    { token = "$branch", dim = false },
    { token = "$pr_open", dim = false, fg = "#3fb950" },
    { token = "$pr_draft", dim = false, fg = "#8b949e" },
    { token = "$pr_merged", dim = false, fg = "#a371f7" },
    { token = "$pr_closed", dim = false, fg = "#f85149" },
  ],
]

[experimental]
kitty_graphics = true

[update]
channel = "preview"
