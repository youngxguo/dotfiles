# Match the tmux hierarchy: workspaces are sessions and tabs are windows.
[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Session/workspace controls.
settings = ""
workspace_picker = "prefix+s"
new_workspace = "prefix+shift+c"
switch_workspace = "cmd+1..9"

# Window/tab controls.
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "shift+left"
next_tab = "shift+right"

# Pane splits match tmux: a vertical divider opens right; a horizontal divider
# opens down.
split_vertical = ["prefix+backslash", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]

[ui]
prompt_new_tab_name = false
prompt_new_workspace_name = true
pane_gaps = false
agent_panel_sort = "spaces"
