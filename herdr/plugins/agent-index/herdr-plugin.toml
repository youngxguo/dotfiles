id = "young.agent-index"
name = "Agent Index"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Keep Agent sidebar numbers aligned with cmd+1 through cmd+9"
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "index.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "index.py"]

[[events]]
on = "pane.closed"
command = ["python3", "index.py"]

[[events]]
on = "pane.moved"
command = ["python3", "index.py"]

[[events]]
on = "tab.moved"
command = ["python3", "index.py"]

[[events]]
on = "tab.closed"
command = ["python3", "index.py"]

[[events]]
on = "workspace.moved"
command = ["python3", "index.py"]

[[events]]
on = "workspace.reordered"
command = ["python3", "index.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "index.py"]
