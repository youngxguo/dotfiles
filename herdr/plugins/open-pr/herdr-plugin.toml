id = "young.open-pr"
name = "Open PR"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Open the focused pane's pull request on GitHub"
platforms = ["linux", "macos"]

# The agent sidebar shows each pane's PR ($pr, reported by
# claude/statusline-command.sh) but herdr strips escape bytes from pane
# metadata, so the row cannot be a hyperlink. This action is the click-through:
# herdr/config.toml binds it to prefix+p, and the pane context puts it in the
# pane's right-click menu.
[[actions]]
id = "open-pr"
title = "Open pull request on GitHub"
contexts = ["pane", "global"]
command = ["python3", "open_pr.py"]
