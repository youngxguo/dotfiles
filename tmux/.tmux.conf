set-option -g status-interval 15
if-shell 'test -x /usr/bin/zsh' 'set-option -g default-shell /usr/bin/zsh' 'if-shell "test -x /bin/zsh" "set-option -g default-shell /bin/zsh"'
set-option -g status-position bottom
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set-window-option -g mode-keys vi
set-option -g mouse on
set-option -g set-clipboard on
set-option -g focus-events on
set-option -g history-limit 100000
set-option -g allow-passthrough on
set-option -g base-index 1
set-window-option -g pane-base-index 1

unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

unbind -n C-d
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key r source-file ~/.tmux.conf \; run-shell '~/.tmux-sidebar.sh reset-all' \; display-message "tmux config reloaded"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi / command-prompt -p "(search up)" "send -X search-backward \"%%%\""

unbind -n C-Tab
unbind -n C-S-Tab
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n S-Up    swap-window -t -1\; select-window -t -1
bind -n S-Down  swap-window -t +1\; select-window -t +1

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
is_codex="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?(codex|ocdex)$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'
bind -n M-Enter if-shell "$is_codex" 'send-keys C-j' 'send-keys M-Enter'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

bind-key s run-shell '~/.tmux-update-branches.sh' \; choose-tree -s -O name -K '#{e|+:#{line},1}' -F '#{?#{@session_ai_idle},! ,#{?#{@session_ai_thinking},💭 ,}}#{?#{@git_branch},[#{@git_branch}] ,}#{?session_attached,(attached),}'
bind-key b run-shell '~/.tmux-sidebar.sh toggle'
bind-key -n MouseDown1Pane if-shell -F -t = '#{@sidebar}' \
  "run-shell '~/.tmux-sidebar.sh click #{mouse_y} #{q:client_name}'" \
  "select-pane -t = \\; send-keys -M"
set-hook -g window-linked "run-shell '~/.tmux-sidebar.sh ensure #{window_id}'"
set-hook -g client-session-changed "run-shell -b '~/.tmux-update-branches.sh #{q:session_name}; ~/.tmux-sidebar.sh refresh'"
set-hook -g pane-focus-in "run-shell -b '~/.tmux-update-branches.sh #{q:session_name}; ~/.tmux-sidebar.sh refresh'"
set-hook -g session-created "run-shell '~/.tmux-sidebar.sh refresh'"
set-hook -g session-closed "run-shell '~/.tmux-sidebar.sh refresh'"
set-hook -g session-renamed "run-shell '~/.tmux-sidebar.sh refresh'"
set-hook -g window-renamed "run-shell '~/.tmux-sidebar.sh refresh'"
# Ghostty sends Cmd 1-9 through CSI-u. tmux represents that modifier as Meta;
# Herdr keeps it as Command.
bind-key -n M-1 run-shell '~/.tmux-sidebar.sh switch 1 "#{client_name}"'
bind-key -n M-2 run-shell '~/.tmux-sidebar.sh switch 2 "#{client_name}"'
bind-key -n M-3 run-shell '~/.tmux-sidebar.sh switch 3 "#{client_name}"'
bind-key -n M-4 run-shell '~/.tmux-sidebar.sh switch 4 "#{client_name}"'
bind-key -n M-5 run-shell '~/.tmux-sidebar.sh switch 5 "#{client_name}"'
bind-key -n M-6 run-shell '~/.tmux-sidebar.sh switch 6 "#{client_name}"'
bind-key -n M-7 run-shell '~/.tmux-sidebar.sh switch 7 "#{client_name}"'
bind-key -n M-8 run-shell '~/.tmux-sidebar.sh switch 8 "#{client_name}"'
bind-key -n M-9 run-shell '~/.tmux-sidebar.sh switch 9 "#{client_name}"'
bind-key c new-window -c "#{pane_current_path}"
bind-key C command-prompt -p "new session name:" "new-session -c '#{pane_current_path}' -s '%%'"
bind-key X confirm-before -p "kill session #S? (y/n)" "run-shell '~/.tmux-kill-session.sh #{q:session_name} #{q:client_name}'"
bind-key t run-shell "~/.tmux-setup-sessions.sh --session '#{session_name}' --window '#{window_id}' '#{pane_current_path}' && ~/.tmux-setup-vim.sh '#{session_name}'"

set-option -g popup-border-lines rounded
set-option -g popup-border-style "fg=#{@solarized_blue}"
set-option -g popup-style "bg=#{@solarized_base03},fg=#{@solarized_base1}"

bind-key e display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" 'if command -v lazygit >/dev/null 2>&1; then exec lazygit; elif command -v gitui >/dev/null 2>&1; then exec gitui; elif command -v tig >/dev/null 2>&1; then exec tig; else git -c color.ui=always status; echo; exec "${SHELL:-/bin/zsh}"; fi'

set -g default-terminal "tmux-256color"
# Ask Ghostty for CSI-u modified-key events so its real Cmd+1..9 chords can
# share the same path as Herdr instead of using tmux-only private sequences.
set -s extended-keys always
set -s extended-keys-format csi-u
# Unset first so a `prefix-r` reload restores the built-in default array and
# re-appends these once, instead of duplicating them on every reload.
set-option -su terminal-features
set-option -sa terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB:extkeys"

run-shell '"$HOME/.tmux-palette.sh"'

set-option -g @pl_right ""
set-option -g @pl_right_thin ""
set-option -g @pl_left ""
set-option -g @pl_left_thin ""

set-option -g status-style "fg=#{@solarized_base1},bg=#{@solarized_base02}"
set-option -g status-justify left
set-option -g mode-style "fg=#{@solarized_base3},bg=#{@solarized_blue},bold"
set-option -g message-style "fg=#{@solarized_base3},bg=#{@solarized_blue}"
set-option -g message-command-style "fg=#{@solarized_base3},bg=#{@solarized_blue}"

set-window-option -g window-status-style "fg=#{@solarized_base00},bg=#{@solarized_base02}"
set-window-option -g window-status-current-style "fg=#{@solarized_base3},bg=#{@solarized_blue},bold"
set-window-option -g window-status-bell-style "fg=#{@solarized_base3},bg=#{@solarized_red},bold"
set-window-option -g window-status-separator ""
set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-current-format "#[fg=#{@solarized_base02},bg=#{@solarized_blue}]#{@pl_right}#[fg=#{@solarized_base3},bg=#{@solarized_blue},bold] #I:#W#{?window_zoomed_flag,[Z],} #[fg=#{@solarized_blue},bg=#{@solarized_base02}]#{@pl_right}"

set-option -g pane-border-style "fg=#{@solarized_base01}"
set-option -g pane-active-border-style "fg=#{@solarized_blue},bold"
set-option -g pane-border-status off

bind-key % run-shell "~/.tmux-agent-split.sh h '#{pane_id}'"
bind-key '"' run-shell "~/.tmux-agent-split.sh v '#{pane_id}'"
bind-key \\ run-shell "~/.tmux-agent-split.sh h '#{pane_id}'"
bind-key - run-shell "~/.tmux-agent-split.sh v '#{pane_id}'"
run-shell '~/.tmux-sidebar.sh install-hooks'

set-option -g window-style "bg=#{@solarized_base02}"
set-option -g window-active-style "bg=#{@solarized_base03}"

set-option -g status-left-length 60
set-option -g status-right-length 50
set-option -g status-left "#[fg=#{@solarized_base3},bg=#{@solarized_yellow},bold] #S #[fg=#{@solarized_yellow},bg=#{@solarized_base01},nobold]#{@pl_right}#[fg=#{@solarized_base3},bg=#{@solarized_base01}] #{@git_branch} #[fg=#{@solarized_base01},bg=#{@solarized_base02}]#{@pl_right}"
set-option -g status-right "#(~/.tmux-ai-status.sh)#[fg=#{@solarized_base01},bg=#{@solarized_base02}]#{@pl_left}#[fg=#{@solarized_base3},bg=#{@solarized_base01},nobold] %a %b %d #[fg=#{@solarized_blue},bg=#{@solarized_base01}]#{@pl_left}#[fg=#{@solarized_base3},bg=#{@solarized_blue},bold] %I:%M %p "

run-shell '~/.tmux-sidebar.sh ensure-all'
