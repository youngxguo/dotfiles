name: ci

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: set up node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: pi/extensions/package.json
          cache: npm
          cache-dependency-path: pi/extensions/package-lock.json

      - name: lint
        run: pipx run pre-commit run --all-files --show-diff-on-failure

      - name: test
        run: make test-python test-pi

      - name: check Skills CLI discovery
        env:
          DISABLE_TELEMETRY: "1"
        run: npx --yes skills add . --list
