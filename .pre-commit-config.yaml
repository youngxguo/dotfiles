repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]
  # The tests run on every commit, the same as CI: master takes direct commits,
  # so this hook is the only gate before a push.
  - repo: local
    hooks:
      - id: test-python
        name: python tests
        entry: make test-python
        language: system
        pass_filenames: false
        always_run: true
      - id: test-pi
        name: pi extension tests
        entry: make test-pi
        language: system
        pass_filenames: false
        files: ^pi/extensions/
